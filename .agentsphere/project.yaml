schemaVersion: 2
rationale: TypeScript library with Jest (ts-jest) for insurance claim payout calculation. No runtime dependencies. Tests run via npm test with jest-junit XML report.
components:
  - name: app
    path: .
    toolchain:
      image: agentsphere/sandbox-polyglot
    verify:
      - npm ci
      - npm test
    artifacts_ignore:
      - node_modules/
      - dist/
definition_of_done:
  - All verify commands pass on the submitted commit
network:
  needs: []
